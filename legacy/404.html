<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Ignite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@600;700;800&family=Rammetto+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: var(--bg-cream);
    }
    .error-image {
      max-width: 600px;
      width: 100%;
      height: auto;
      margin-bottom: 2rem;
    }
    .error-page h1 {
      font-family: var(--font-rammetto);
      font-weight: 400;
      font-size: clamp(2.5rem, 8vw, 4rem);
      margin-bottom: 1rem;
      color: var(--primary-orange);
    }
    .error-page p {
      margin-bottom: 2rem;
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <img src="assets/404%20Error.png" alt="404 Error" class="error-image">
    <h1>Whoops! Your fire went out.</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="index.html" class="btn btn-primary btn-large">Back to Safety 🔥</a>
  </div>
</body>
</html>
