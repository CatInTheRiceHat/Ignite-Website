# Ignite short addresses: /home, /courses, /campfire and /shop.
# Included inside the learn.ignitefindyourfire.org virtual host; see SYNC.md.
# The pages themselves are unchanged and their long addresses still work with any query string.
RewriteEngine On

# A plain visit to a long address is sent on to its short one, so the tabs and the page after login show it.
# Only a GET with no query string is moved; forms, edit mode and filtered lists keep the long address.
RewriteCond %{THE_REQUEST} "^GET /my/? HTTP"
RewriteRule ^ /home [R=302,L]
RewriteCond %{THE_REQUEST} "^GET /course/(index\.php)? HTTP"
RewriteRule ^ /courses [R=302,L]
RewriteCond %{THE_REQUEST} "^GET /local/ignite/passport\.php HTTP"
RewriteRule ^ /campfire [R=302,L]
RewriteCond %{THE_REQUEST} "^GET /local/ignite/shop\.php HTTP"
RewriteRule ^ /shop [R=302,L]

# Each short address shows its page without changing what is in the address bar.
RewriteRule ^/home/?$ /my/index.php [PT,L]
RewriteRule ^/courses/?$ /course/index.php [PT,L]
RewriteRule ^/campfire/?$ /local/ignite/passport.php [PT,L]
RewriteRule ^/shop/?$ /local/ignite/shop.php [PT,L]
