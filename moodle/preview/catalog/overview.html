<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course overview preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Poppins:wght@600;700&family=Rammetto+One&display=swap">
<link rel="stylesheet" href="raw.css"><link rel="stylesheet" href="../../local/ignite/catalog.css">
<!-- Stand-ins for the Bootstrap rules Moodle's own card markup relies on. -->
<style>
body { margin: 0; padding: 1.5rem; background: #fff8f0; font-family: Nunito, system-ui, sans-serif; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
.card { display: flex; flex-direction: column; background: #fff; }
.d-flex { display: flex; } .w-100 { width: 100%; } .text-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 1rem; max-width: 60rem; }
.card-img-top { display: block; }
</style></head>
<body id="page-my-index">
<!-- The card markup follows Moodle's core_course/coursecard template, which the Course overview draws after the page loads. -->
<section class="block_myoverview block"><div class="card-grid" data-region="card-deck"></div></section>
<script type="application/json" id="ignite-catalog-data">{"cards":{
"34":{"audience":"Grades 9–12","weeks":"6","topic":"Civics & Careers","summary":"Find a problem in your community you care about, then plan, pitch and run a project that does something about it.","teachers":[{"name":"Anisa Chandra","url":"#teacher-3"}]},
"33":{"audience":"Grades 9–12","weeks":"6","topic":"Money & Business","summary":"Learn how to build brands, design compelling experiences, and create marketing strategies that reach the people you want to reach.","teachers":[{"name":"Dhruv Agarwal","url":"#teacher-1"}]},
"21":{"audience":"For everyone","weeks":"","topic":"Civics & Careers","summary":"","teachers":[]}},
"text":{"weeks":"{$a} weeks","continue":"Continue"}}</script>
<script>
// Draw the cards the way the Course overview does: some after the page loads, then all again as a search would.
const deck = document.querySelector('[data-region="card-deck"]');
const card = (id, name) => `<div class="col d-flex"><div class="card course-card" role="listitem" data-region="course-content" data-course-id="${id}">
    <a href="#course-${id}" tabindex="-1"><div class="card-img-top" style="background-image: url(cover.jpg)"><span class="sr-only">${name}</span></div></a>
    <div class="card-body course-info-container"><div class="d-flex align-items-start"><div class="w-100 text-truncate">
        <a href="#course-${id}" class="aalink coursename"><span class="sr-only">Course name</span>${name}</a>
        <div class="text-muted muted d-flex flex-wrap"><span class="sr-only">Course category</span><span class="categoryname text-truncate">No Category</span></div>
    </div></div></div>
</div></div>`;
const all = [[34, 'Social Impact and Project Development'], [33, 'Marketing, Branding &amp; Design'], [21, 'Civic Literacy &amp; Community Action'], [99, 'A course with no catalog facts']];
deck.innerHTML = card(...all[0]);
setTimeout(() => deck.insertAdjacentHTML('beforeend', all.slice(1, 3).map(course => card(...course)).join('')), 300);
setTimeout(() => { deck.innerHTML = all.map(course => card(...course)).join(''); }, 600);
</script>
<script src="../../local/ignite/catalog.js"></script></body></html>
