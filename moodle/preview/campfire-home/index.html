<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campfire home preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@600;700;800&family=Rammetto+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../local/ignite/campfire-home.css">
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <nav class="preview-nav" aria-label="Site">Ignite <span>Dashboard</span> <span>Explore</span> <span aria-current="page">Campfire</span></nav>

    <main class="camp-home" data-team="forgelings">
        <header class="camp-banner">
            <div class="camp-plate">
                <div class="camp-plate__top">
                    <img class="camp-plate__crest" data-art="top" alt="">
                    <img class="camp-plate__medal" data-art="medal" alt="" width="384" height="384">
                </div>
                <img class="camp-plate__picture" data-art="large" alt="" width="1920" height="1071">
                <img class="camp-plate__crest camp-plate__crest--bottom" data-art="bottom" alt="">
            </div>
            <div class="camp-banner__words">
                <p class="camp-banner__lead">You’re one of the</p>
                <h1 data-text="name"></h1>
                <p class="camp-banner__line" data-text="line"></p>
                <dl class="camp-figures">
                    <div><dt>Team XP this month</dt><dd data-text="teamxp"></dd></div>
                    <div><dt data-text="placelabel"></dt><dd data-text="place"></dd></div>
                </dl>
            </div>
        </header>

        <section class="camp-fires" aria-labelledby="camp-fires-title">
            <div class="camp-fires__heading">
                <h2 id="camp-fires-title" data-text="month"></h2>
                <p class="camp-heat">The <span data-text="heat"></span> Heat ends in <strong data-text="countdown"></strong></p>
            </div>
            <p class="camp-prizes">When the Heat ends, your team’s place drops Embers for everyone who added Team XP: 100 for 1st, 50 for 2nd, 30 for 3rd.</p>
            <ul class="camp-fires__list"></ul>
        </section>

        <section class="camp-yours" aria-label="Your contribution">
            <p data-text="contribution"></p>
            <a class="camp-button" href="#courses">Find a course</a>
        </section>
    </main>

    <form class="preview-controls" aria-label="Preview controls">
        <strong>Preview only</strong>
        <label>Team <select name="team">
            <option value="forgelings">Forgelings</option>
            <option value="candlelings">Candlelings</option>
            <option value="lanternlings">Lanternlings</option>
        </select></label>
        <label>Situation <select name="situation">
            <option value="leading">Leading</option>
            <option value="behind">Behind</option>
            <option value="tie">Tie</option>
            <option value="empty">New month</option>
        </select></label>
    </form>

    <template id="fire">
        <li class="fire">
            <div class="fire__stage">
                <span class="fire__glow"></span>
                <span class="fire__grow"><img class="fire__flame" alt=""></span>
                <img class="fire__logs" src="../../local/ignite/pix/campfire/logs.png" alt="" width="900" height="367">
            </div>
            <p class="fire__yours"><span class="fire__wide">Your Campfire</span><span class="fire__narrow">Yours</span></p>
            <h3 class="fire__name"></h3>
            <p class="fire__score"></p>
        </li>
    </template>

    <script src="home.js"></script>
</body>
</html>
